<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Application Tracker - EaseKolar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    })();
  </script>

  <style>
    :root {
      --page-bg: transparent;
      --text: #0f274b;
      --muted: #5f6f8a;
      --card-bg: #ffffff;
      --card-shadow: 0 10px 28px rgba(24,37,56,.12);
      --th-bg: #edf3fb;
      --th-text: #244372;
      --table-text: #1d2a44;
      --row-even: #f8fbff;
      --row-hover: #ebf3ff;
      --row-line: #d8e5f8;
      --filter-all-bg: #64748b;
    }

    html[data-theme="dark"] {
      --page-bg: transparent;
      --text: #ffffff;
      --muted: #9ca3af;
      --card-bg: #111c44;
      --card-shadow: 0 4px 20px rgba(0,0,0,0.3);
      --th-bg: #1a2758;
      --th-text: #c9d1f2;
      --table-text: #e0e6f0;
      --row-even: #13204a;
      --row-hover: #1e2d6d;
      --row-line: #273362;
      --filter-all-bg: #475569;
    }

    body {
      font-family: "Poppins", sans-serif;
      background-color: var(--page-bg);
      color: var(--text);
      margin: 0;
      padding: 40px;
      transition: background-color .2s ease, color .2s ease;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 20px;
      box-shadow: var(--card-shadow);
      padding: 30px;
      max-width: 1100px;
      margin: 0 auto;
      transition: background-color .2s ease, box-shadow .2s ease;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      color: var(--table-text);
      border-radius: 12px;
      overflow: hidden;
      transition: color .2s ease;
    }

    th, td {
      padding: 12px 10px;
      text-align: center;
      border-bottom: 1px solid var(--row-line);
    }

    th {
      background-color: var(--th-bg);
      color: var(--th-text);
      font-weight: 600;
      transition: background-color .2s ease, color .2s ease;
    }

    tr:nth-child(even) {
      background-color: var(--row-even);
    }

    tr:hover {
      background-color: var(--row-hover);
      transition: 0.3s;
    }

    .status {
      font-weight: 600;
      border-radius: 8px;
      padding: 5px 10px;
      display: inline-block;
    }

    .status.approved {
      background-color: #16a34a;
      color: white;
    }

    .status.rejected {
      background-color: #dc2626;
      color: white;
    }

    .status.pending {
      background-color: #d97706;
      color: white;
    }

    .filter-btn {
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
      font-weight: 600;
      margin-right: 5px;
    }

    .all { background: var(--filter-all-bg); color: white; }
    .approved-btn { background: #16a34a; color: white; }
    .rejected-btn { background: #dc2626; color: white; }
    .pending-btn { background: #d97706; color: white; }
    .filter-btn:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Application Tracking</h1>
    <p>Here are the scholarship applications you submitted:</p>

    <div style="margin-bottom: 15px;">
      <button onclick="setFilter('All')" class="filter-btn all">All</button>
      <button onclick="setFilter('Approved')" class="filter-btn approved-btn">Approved</button>
      <button onclick="setFilter('Rejected')" class="filter-btn rejected-btn">Rejected</button>
      <button onclick="setFilter('Pending')" class="filter-btn pending-btn">Pending</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Program</th>
          <th>Campus</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="historyTable"></tbody>
    </table>
  </div>

<script>
  (function installPromptAlerts() {
    if (window.__easePromptInstalled) return;
    window.__easePromptInstalled = true;
    const style = document.createElement('style');
    style.textContent = `
      .ease-prompt-host{position:fixed;top:18px;right:18px;z-index:99999;display:grid;gap:10px;pointer-events:none}
      .ease-prompt{min-width:280px;max-width:min(440px,calc(100vw - 36px));padding:12px 14px;border-radius:12px;border:1px solid var(--row-line,#dbe7fb);background:var(--card-bg,#fff);color:var(--text,#0f274b);box-shadow:0 12px 28px rgba(15,39,75,.14);display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;animation:easePromptIn .2s ease}
      .ease-prompt i{margin-top:2px;font-size:14px;color:#1d4ed8}
      .ease-prompt .msg{font-size:13px;line-height:1.45;word-break:break-word}
      @keyframes easePromptIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
    `;
    document.head.appendChild(style);
    const host = document.createElement('div');
    host.className = 'ease-prompt-host';
    host.setAttribute('aria-live', 'polite');
    host.setAttribute('aria-atomic', 'true');
    document.body.appendChild(host);
    window.alert = function alertPrompt(message) {
      const item = document.createElement('div');
      item.className = 'ease-prompt';
      item.innerHTML = '<i class="fa-solid fa-circle-info" aria-hidden="true"></i><div class="msg"></div>';
      item.querySelector('.msg').textContent = String(message || '').trim();
      host.appendChild(item);
      setTimeout(() => {
        item.style.opacity = '0';
        item.style.transform = 'translateY(-4px)';
        item.style.transition = 'opacity .18s ease, transform .18s ease';
        setTimeout(() => item.remove(), 180);
      }, 3200);
    };
  })();
</script>

<script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const SUPABASE_URL = "https://qdrnqkoozsloeqzxpgha.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkcm5xa29venNsb2VxenhwZ2hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk1ODQ5MjgsImV4cCI6MjA3NTE2MDkyOH0.E4Lp4LtyvRfFoImUkZMFyVBM7sro4aoNlQEa7sUIsIs";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

let applicantData = [];
let activeFilter = "All";

function applyTheme(theme) {
  const resolved = theme === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', resolved);
  document.body.classList.toggle('theme-light', resolved === 'light');
}

window.addEventListener('message', (event) => {
  if (event.origin !== window.location.origin) return;
  const payload = event.data || {};
  if (payload.type !== 'easekolar-theme') return;
  applyTheme(payload.theme);
});

async function fetchApplications() {
  const { data: userData } = await supabase.auth.getUser();
  const user = userData?.user;

  if (!user) {
    alert("You must be logged in first!");
    return;
  }

  const { data, error } = await supabase
    .from("applicants_iskolar")
    .select("Name, scholarship_program, campus, status, email")
    .eq("email", user.email)
    .order("id", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  applicantData = data;
  renderApplications();
}

function renderApplications() {
  const tbody = document.getElementById("historyTable");
  tbody.innerHTML = "";

  let filtered = applicantData;

  if (activeFilter !== "All") {
    filtered = applicantData.filter(a =>
      a.status && a.status.toLowerCase() === activeFilter.toLowerCase()
    );
  }

  filtered.forEach((row, index) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td>${row.Name || 'N/A'}</td>
      <td>${row.scholarship_program || 'N/A'}</td>
      <td>${row.campus || 'N/A'}</td>
      <td><span class="status ${row.status?.toLowerCase() || ''}">${row.status || 'N/A'}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

window.renderApplications = renderApplications;

function setFilter(filter) {
  activeFilter = filter;
  renderApplications();
}

window.setFilter = setFilter;
window.onload = () => {
  applyTheme(localStorage.getItem('theme'));
  fetchApplications();
};
</script>

  <script src="shared/autocomplete-off.js" defer></script>
</body>
</html>
