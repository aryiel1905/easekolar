<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>Scholarship Application</title>
    <script>
      (function bootThemeEarly() {
        try {
          var params = new URLSearchParams(window.location.search);
          var mode = (params.get("theme") || "").trim().toLowerCase();

          if (mode !== "light" && mode !== "dark" && window.self !== window.top) {
            try {
              var pdoc = window.parent && window.parent.document;
              if (pdoc && pdoc.body) {
                mode = pdoc.body.classList.contains("dark") ? "dark" : "light";
              }
            } catch (_) {}
          }

          if (mode !== "light" && mode !== "dark") {
            var saved = localStorage.getItem("theme");
            if (saved === "light" || saved === "dark") mode = saved;
          }

          if (mode !== "light" && mode !== "dark") {
            mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }

          document.documentElement.setAttribute("data-theme", mode);
        } catch (_) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <style> 
      :root{
        --bg:#0a1224; --bg2:#0b1630; --card:#111f3d; --border:#243352;
        --text:#f3f6ff; --muted:#a7b3d3; 
        --accent:#f0c419; --accent-2:#eab308; --accent-hover:#ffd765;
        --ring:rgba(234,179,8,.35); --radius:18px;
        --shadow-1:0 10px 26px rgba(0,0,0,.35); --shadow-2:0 22px 60px rgba(0,0,0,.38);
        --input-bg:#0f1b36; --input-border:#223153; --input-border-hover:#2b3c62;
        --file-border:#2a3a60; --file-border-hover:#385086;
        --accent-light: #facc15; /* yellow */
        --accent-dark: #3b82f6;  /* blue for dark theme accent bar */
      }
      html[data-theme="light"], .theme-light{
        --bg:#EEF3F9; --bg2:#E9EFF8; --card:#FFFFFF; --border:#E2EAF5;
        --text:#0F1A2B; --muted:#64748B; --ring:rgba(234,179,8,.28);
        --input-bg:#FFFFFF; --input-border:#D8E2EF; --input-border-hover:#C9D6EA;
        --file-border:#D8E2EF; --file-border-hover:#C9D6EA;
        --shadow-1:0 8px 24px rgba(15,23,42,.06); --shadow-2:0 16px 40px rgba(15,23,42,.08);
      }

      *{box-sizing:border-box} html,body{height:100%}
      body{
        margin:0; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--text);
        background:radial-gradient(1200px 700px at 70% -10%, var(--bg2) 0%, var(--bg) 55%, var(--bg) 100%) fixed;
        background-color:var(--bg);
      }
      html:not([data-theme="light"]) body::before,
      body:not(.theme-light)::before{
        content:""; position:fixed; inset:0; pointer-events:none; opacity:.55;
        background:
          radial-gradient(1px 1px at 22% 30%, rgba(255,255,255,.18) 99%, transparent 100%),
          radial-gradient(1px 1px at 44% 70%, rgba(255,255,255,.14) 99%, transparent 100%),
          radial-gradient(1px 1px at 71% 22%, rgba(255,255,255,.13) 99%, transparent 100%),
          radial-gradient(1px 1px at 87% 60%, rgba(255,255,255,.18) 99%, transparent 100%),
          radial-gradient(1px 1px at 12% 82%, rgba(255,255,255,.12) 99%, transparent 100%);
      }

      main{min-height:100svh; display:flex; align-items:flex-start; justify-content:center; padding:clamp(20px,4vw,40px)}
      .form-shell{
        width:min(1200px,100%); background:var(--card);
        border:1px solid var(--border); border-radius:calc(var(--radius) + 4px);
        box-shadow:var(--shadow-2); padding:clamp(18px,3.4vw,28px);
      }
      html.embedded-app, html.embedded-app body{height:auto}
      html.embedded-app body{
        background:transparent !important;
        background-color:transparent !important;
      }
      html.embedded-app body::before{display:none}
      html.embedded-app main{
        min-height:auto;
        padding:0;
      }
      html.embedded-app .form-shell{
        width:100%;
        background:transparent !important;
        background-image:none !important;
        background-color:transparent !important;
        border:0 !important;
        border-radius:0 !important;
        box-shadow:none !important;
        padding:0 !important;
      }
      html.embedded-app #application{
        background:transparent !important;
        border:0 !important;
        box-shadow:none !important;
      }
      html.embedded-app .theme-toggle{display:none !important}
      .title{margin:0 0 6px; font-size:clamp(22px,2.6vw,28px); font-weight:800; letter-spacing:-.01em}
      .subtitle{color:var(--muted); margin:0 0 18px}

      form{display:grid; gap:16px}
      .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
      .grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px}
      .grid-4{display:grid; grid-template-columns:repeat(4,1fr); gap:16px}
      @media (max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}

      label{display:block; font-size:12px; font-weight:700; letter-spacing:.02em; color:var(--muted); margin-bottom:6px}
      input[type="text"], input[type="date"], input[type="email"], input[type="tel"], select{
        width:100%; color:var(--text); background:var(--input-bg); border:1px solid var(--input-border);
        border-radius:12px; padding:12px 14px; outline:none; transition:box-shadow .2s, border-color .2s;

      select.prefilled-select{

        -moz-appearance:none;
        appearance:none;
        background-image:none !important;
        padding-right:14px;
      }
      select.prefilled-select::-ms-expand{ display:none; }
      input::placeholder{color:#8fa0c4} html[data-theme="light"] input::placeholder, .theme-light input::placeholder{color:#98a5bf}
      input:hover{border-color:var(--input-border-hover)}
      input:focus{box-shadow:0 0 0 4px var(--ring); border-color:transparent}

      /* File control (matches your Upload COG) */
      .file{
        position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
        padding:14px; background:var(--input-bg); border:1px dashed var(--file-border); border-radius:12px; cursor:pointer;
        text-align:center;
      }
      .file strong{font-size:13px; color:var(--text)} .file span{font-size:12px; color:var(--muted)}
      .file:hover{border-color:var(--file-border-hover)}
      .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}

      .preview{display:none; margin-top:8px; padding:8px; border:1px solid var(--input-border); background:var(--input-bg);
        border-radius:12px; justify-content:center; align-items:center;}
      .preview.active{ display:flex; }
      .preview img{max-width:100%; max-height:240px; border-radius:8px; display:block; object-fit:contain;}

      /* Inline status for grade check */
      .status{margin-top:8px; font-size:12px; padding:8px 10px; border-radius:10px; border:1px solid; display:none}
      .status.ok{display:block; color:#065f46; background:#ecfdf5; border-color:#a7f3d0}
      .status.fail{display:block; color:#991b1b; background:#fef2f2; border-color:#fecaca}
      .status.neutral{display:block; color:#1f2937; background:#f3f4f6; border-color:#e5e7eb}

      .submit{margin-top:6px; width:100%; padding:14px 16px; border-radius:14px; font-weight:900; letter-spacing:.02em;
        border:0; cursor:pointer; color:#0b1220; background:linear-gradient(180deg, var(--accent), var(--accent-2));
        box-shadow:0 12px 32px rgba(234,179,8,.28);}
      .submit:hover{background:linear-gradient(180deg, var(--accent-hover), var(--accent))}
      .submit[disabled]{opacity:.6; cursor:not-allowed; box-shadow:none}

      .toast{position:fixed; right:18px; bottom:18px; background:var(--card); border:1px solid var(--border);
        color:var(--text); padding:12px 14px; border-radius:12px; box-shadow:var(--shadow-1); display:none;}

      /* Additional Requirements UI */
      .section-header { display:flex; align-items:center; gap:0.5rem; margin-bottom:8px; }
      .section-header h3 { font-weight:700; font-size:1.05rem; color:var(--text); margin:0; }
      .accent-bar { width:6px; height:26px; border-radius:4px; }

      /* theme-adaptive accent */
      :root .accent-bar { background: var(--accent-light); }
      html[data-theme="light"] .accent-bar, .theme-light .accent-bar { background: var(--accent-light); }
      html:not([data-theme="light"]) .accent-bar, body:not(.theme-light) .accent-bar { background: var(--accent-dark); }

      /* responsive requirements grid: 4 cols desktop, 2 tablet, 1 mobile */
      .requirements-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(4, 1fr);
      }
      @media (max-width: 1000px) { .requirements-grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 560px)  { .requirements-grid { grid-template-columns: 1fr; } }

      /* subtle hover lift */
      .requirements-grid > div { transition: transform .16s ease, background .16s ease; }
      .requirements-grid > div:hover { transform: translateY(-3px); background: rgba(255,255,255,0.02); border-radius:10px; }

      /* small utility */
      .muted { color:var(--muted); font-size:12px; }

      /* Modal popup etc unchanged below (omitted for brevity) */
    </style>
  </head>

<script>
/**********************
 * THEME TOGGLE
 **********************/
const themeToggle = document.getElementById("themeToggle");
const themeIcon = document.getElementById("themeIcon");
const THEME_KEY = "theme";
const LEGACY_THEME_KEY = "scholarship_theme";
const queryParams = new URLSearchParams(window.location.search);
const isEmbeddedApp = window.self !== window.top || queryParams.get("embed") === "1";
if (isEmbeddedApp) {
  document.documentElement.classList.add("embedded-app");
}

function readThemeFromAncestors() {
  let inferred = null;
  try {
    const parentDoc = window.parent?.document;
    if (parentDoc?.body?.classList?.contains("dark")) inferred = "dark";
    else if (parentDoc?.documentElement?.getAttribute("data-theme") === "dark") inferred = "dark";
    else if (parentDoc?.documentElement?.getAttribute("data-theme") === "light") inferred = "light";
  } catch (_) {}

  try {
    const topDoc = window.parent?.parent?.document;
    if (topDoc?.body?.classList?.contains("dark")) inferred = "dark";
    else if (topDoc?.body) inferred = "light";
  } catch (_) {}

  return inferred;
}

function getStoredTheme() {
  const fromUrl = (queryParams.get("theme") || "").trim().toLowerCase();
  if (fromUrl === "light" || fromUrl === "dark") return fromUrl;

  if (isEmbeddedApp) {
    return readThemeFromAncestors();
  }

  const shared = localStorage.getItem(THEME_KEY);
  if (shared === "light" || shared === "dark") return shared;

  const legacy = localStorage.getItem(LEGACY_THEME_KEY);
  if (legacy === "light" || legacy === "dark") return legacy;
  return null;
}

function applyTheme(mode, persist = true) {
  const isLight = mode === "light";
  const current = document.body.classList.contains("theme-light") ? "light" : "dark";
  if (current === mode) {
    if (persist) {
      localStorage.setItem(THEME_KEY, mode);
      localStorage.setItem(LEGACY_THEME_KEY, mode);
    }
    return;
  }
  document.documentElement.setAttribute("data-theme", isLight ? "light" : "dark");
  document.body.classList.toggle("theme-light", isLight);
  if (themeToggle) themeToggle.setAttribute("aria-pressed", String(isLight));
  if (themeIcon) themeIcon.textContent = isLight ? "\u2600\uFE0F" : "\uD83C\uDF19";
  if (persist) {
    localStorage.setItem(THEME_KEY, mode);
    localStorage.setItem(LEGACY_THEME_KEY, mode);
  }
}

const stored = getStoredTheme();
const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
applyTheme(stored ?? (prefersLight ? "light" : "dark"), !isEmbeddedApp);
themeToggle?.addEventListener("click", () => {
  applyTheme(document.body.classList.contains("theme-light") ? "dark" : "light", true);
});

function syncThemeFromSharedState() {
  if (isEmbeddedApp) {
    const embeddedMode = readThemeFromAncestors();
    if (embeddedMode) applyTheme(embeddedMode, false);
    return;
  }
  const shared = getStoredTheme();
  if (!shared) return;
  const current = document.body.classList.contains("theme-light") ? "light" : "dark";
  if (shared !== current) applyTheme(shared, false);
}

window.addEventListener("storage", (event) => {
  if (event.key === THEME_KEY || event.key === LEGACY_THEME_KEY) {
    syncThemeFromSharedState();
  }
});

window.addEventListener("message", (event) => {
  if (event.origin && event.origin !== window.location.origin) return;
  const data = event.data || {};
  if (data.type !== "easekolar-theme") return;
  const mode = data.theme === "light" ? "light" : "dark";
  applyTheme(mode, false);
});

if (isEmbeddedApp) {
  syncThemeFromSharedState();
  try {
    window.parent?.postMessage({ type: "easekolar-theme-request" }, window.location.origin);
  } catch (_) {
    // ignore cross-frame postMessage failures
  }
  setInterval(syncThemeFromSharedState, 300);
}

/**********************
 * SUPABASE
 **********************/
const SUPABASE_URL = "https://qdrnqkoozsloeqzxpgha.supabase.co";
const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkcm5xa29venNsb2VxenhwZ2hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk1ODQ5MjgsImV4cCI6MjA3NTE2MDkyOH0.E4Lp4LtyvRfFoImUkZMFyVBM7sro4aoNlQEa7sUIsIs";
let supabase = null;
let lastRenderedRequirementsKey = "__init__";

async function getSupabaseClient() {
  if (supabase) return supabase;

  if (window.supabase?.createClient) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return supabase;
  }

  const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
  supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return supabase;
}

const form = document.getElementById("applicationForm");
const submitBtn = document.getElementById("submitBtn");
const toast = document.getElementById("toast");

// show toast helper
function showToast(message) {
  toast.textContent = message;
  toast.style.display = "block";
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => (toast.style.display = "none"), 4200);
}

function showResultMessage(message, state = "success") {
  const el = document.getElementById("resultMessage");
  if (!el) return;
  el.textContent = message;
  const isLegacyError = typeof state === "boolean" ? state : false;
  const mode = typeof state === "string" ? state : (isLegacyError ? "error" : "success");
  if (mode === "error") {
    el.style.color = "#ef4444";
  } else if (mode === "info") {
    el.style.color = "#2563eb";
  } else {
    el.style.color = "#10b981";
  }
}

submitBtn?.addEventListener("click", () => {
  showResultMessage("Submit clicked. Processing...", "info");
});

function normalizeCampusForStorage(value) {
  const text = String(value || "").trim();
  if (!text) return "";
  const normalized = text
    .toLowerCase()
    .replace(/^prmsu\s*/i, "")
    .replace(/\./g, "")
    .replace(/\s+/g, " ")
    .trim();
  const map = {
    "iba": "PRMSU Iba",
    "castillejos": "PRMSU Castillejos",
    "caste": "PRMSU Castillejos",
    "san marcelino": "PRMSU San Marcelino",
    "botolan": "PRMSU Botolan",
    "candelaria": "PRMSU Candelaria",
    "masinloc": "PRMSU Masinloc",
    "sta cruz": "PRMSU Sta. Cruz",
    "stacruz": "PRMSU Sta. Cruz"
  };
  return map[normalized] || text;
}

function isEmbeddedMode() {
  const params = new URLSearchParams(window.location.search);
  return window.self !== window.top || params.get("embed") === "1";
}

function notifySubmissionSuccessToParent(refId, campus = "") {
  if (!isEmbeddedMode()) return;
  const payload = {
    type: "easekolar-application-submitted",
    ref_id: refId,
    campus: String(campus || "")
  };
  try {
    if (typeof window.parent?.showSubmissionSuccessPrompt === "function") {
      window.parent.showSubmissionSuccessPrompt(refId);
      return;
    }
  } catch (_) {}
  try {
    if (typeof window.parent?.showNotice === "function") {
      window.parent.showNotice(
        "Application submitted successfully.",
        "Success",
        () => {
          try {
            window.parent?.returnToAvailableScholarships?.();
          } catch (_) {}
        }
      );
      return;
    }
  } catch (_) {}
  try {
    window.parent?.postMessage(payload, window.location.origin);
  } catch (_) {}
  try {
    window.top?.postMessage(payload, window.location.origin);
  } catch (_) {}
}

async function handleApplicationSubmit(ev) {
  ev.preventDefault();
  if (!form || !submitBtn) return;

  const reqUploadsEl = document.getElementById("reqUploads");
  const reqHintEl = document.getElementById("reqHint");
  const reqContainerEl = document.getElementById("requirementsContainer");

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";
  showResultMessage("Submitting application...", "info");

  try {
    if (!supabase) await getSupabaseClient();
    if (!supabase) throw new Error("Supabase client is unavailable.");

    const formData = new FormData(form);
    const { data: { user } } = await supabase.auth.getUser();
    const fallbackUploaderId = (formData.get("email") || "")
      .toString()
      .trim()
      .replace(/[^a-z0-9@._-]/gi, "_");
    const uid = user?.id || `anon_${fallbackUploaderId || Date.now()}`;
    if (!user) {
      showResultMessage("No active session detected in the form frame. Submitting using form details.", "info");
    }

    async function uploadFileAndGetUrl(file, prefix = "other") {
      if (!file) return null;
      const path = `${prefix}/${uid}/${Date.now()}_${file.name}`;
      const { error: upErr } = await supabase.storage
        .from("applicants_iskolar")
        .upload(path, file, { cacheControl: "3600", upsert: false });
      if (upErr) {
        console.error("Upload error", upErr);
        return null;
      }
      const { data } = supabase.storage.from("applicants_iskolar").getPublicUrl(path);
      return data?.publicUrl ?? null;
    }

    const dynamicFiles = {};
    reqUploadsEl?.querySelectorAll("input[type=file]").forEach((inp) => {
      dynamicFiles[inp.name] = inp.files?.[0] || null;
    });

    const dynamicUrls = {};
    for (const [k, f] of Object.entries(dynamicFiles)) {
      if (f) dynamicUrls[k] = await uploadFileAndGetUrl(f, "requirements");
    }

    const expectedCount = reqUploadsEl?.querySelectorAll("input[type=file]").length || 0;

    if (error || !inserted) {
      console.error("Insert error", error);
      showResultMessage("Failed to submit application: " + (error?.message || "Unknown insert error"), "error");
      showToast("Submission failed. Please try again.");

function normalizeProgramName(name) {
  return (name || "")
    .toString()
    .toLowerCase()
    .replace(/[’']/g, "")
    .replace(/[–—-]/g, " ")
    .replace(/[^a-z0-9]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function normalizeLoose(name) {
  return (name || "")
    .toString()
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function tokenizeProgramName(name) {
  return normalizeProgramName(name)
    .split(" ")
    .map((t) => t.trim())
    .filter(Boolean);
}

function findBestScholarshipMatch(list, selectedName, selectedValue = "") {
  const targetTokens = new Set(tokenizeProgramName(selectedName));
  const targetId = String(selectedValue || "").trim();

  let best = null;
  let bestScore = -1;

  for (const s of list || []) {
    if (targetId && String(s?.id ?? "").trim() === targetId) return s;

    const name = s?.name || "";
    const tokens = tokenizeProgramName(name);
    if (!tokens.length || !targetTokens.size) continue;

    let overlap = 0;
    for (const t of tokens) {
      if (targetTokens.has(t)) overlap += 1;
    }
    const score = overlap / Math.max(tokens.length, targetTokens.size);

    if (score > bestScore) {
      bestScore = score;
      best = s;
    }
  }

  return bestScore > 0 ? best : null;
}

function normalizeRequirementsValue(value) {
  if (Array.isArray(value)) {
    return value
      .map((v) => {
        if (v && typeof v === "object") {
          return (
            v.name ??
            v.label ??
            v.title ??
            v.document ??
            v.requirement ??
            Object.values(v)[0] ??
            ""
          );
        }
        return String(v);
      })
      .map((v) => String(v).trim())
      .filter(Boolean);
  }

  if (value && typeof value === "object") {
    const vals = Object.values(value).map((v) => String(v).trim()).filter(Boolean);
    if (vals.length) return vals;
  }

  const raw = (value || "").toString().trim();
  if (!raw) return [];

  try {
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed)) return parsed.map((v) => String(v).trim()).filter(Boolean);
    if (parsed && typeof parsed === "object") {
      return Object.values(parsed).map((v) => String(v).trim()).filter(Boolean);
    }
  } catch (_) {}

  const csvLike = raw
    .replace(/^\{|\}$/g, "")
    .split(",")
    .map((r) => r.trim().replace(/^"+|"+$/g, ""))
    .filter(Boolean);
  if (csvLike.length > 1) return csvLike;

  const lineLike = raw
    .split(/\r?\n|;|\|/)
    .map((r) => r.trim().replace(/^[-*•]\s*/, ""))
    .filter(Boolean);
  if (lineLike.length > 1) return lineLike;

  const numberedLike = raw
    .split(/\s+\d+\.\s+/)
    .map((r) => r.trim())
    .filter(Boolean);
  if (numberedLike.length > 1) return numberedLike;

  return csvLike.length ? csvLike : lineLike;
}

function getBootstrapRequirements() {
  const fromUrl = normalizeRequirementsValue(requirementsFromUrl);
  if (fromUrl.length) return fromUrl;

  const fromPayload = normalizeRequirementsValue(selectedScholarshipPayload?.requirements);
  if (fromPayload.length) return fromPayload;

  return [];
}

function extractRequirementsFromRow(row) {
  if (!row || typeof row !== "object") return [];
  const candidates = [
    row.requirements,
    row.requirement,
    row.requirements_list,
    row.required_requirement,
    row.docs_required,
    row.documents,
    row.upload_requirements,
    row.required_docs,
    row.required_documents,
    row.documents_required
  ];
  for (const c of candidates) {
    const normalized = normalizeRequirementsValue(c);
    if (normalized.length) return normalized;
  }

  // Last-resort: scan any key that looks requirement-related.
  const dynamicKeys = Object.keys(row).filter((k) => /require|document|doc/i.test(String(k)));
  for (const key of dynamicKeys) {
    const normalized = normalizeRequirementsValue(row[key]);
    if (normalized.length) return normalized;
  }

  // Deep scan for nested payloads.
  for (const [k, v] of Object.entries(row)) {
    if (!/require|document|doc/i.test(String(k))) continue;
    if (v && typeof v === "object") {
      const nested = normalizeRequirementsValue(v);
      if (nested.length) return nested;
      for (const nv of Object.values(v)) {
        const n2 = normalizeRequirementsValue(nv);
        if (n2.length) return n2;
      }
    }
  }
  return [];
}

function applyProgramSelection(programName, programId = "") {
  const hasName = !!(programName || "").trim();
  const hasId = !!(programId || "").trim();
  if (!hasName && !hasId) return false;
  Array.from(dropdown.options).forEach((opt) => {
    const t = (opt.textContent || "").trim().toLowerCase();
    if (t.startsWith("loading")) {
      opt.remove();
    }
  });
  const target = normalizeProgramName(programName);
  const targetId = String(programId || "").trim();
  if (targetId) {
    for (let i = 0; i < dropdown.options.length; i++) {
      const optId = String(dropdown.options[i].value || "").trim();
      if (optId && optId === targetId) {
        dropdown.selectedIndex = i;
        dropdown.options[i].selected = true;
        dropdown.dataset.prefilledProgram = dropdown.options[i].textContent || "";
        dropdown.dataset.prefilledProgramId = optId;
        markSelectPrefilled(dropdown);
        dropdown.dispatchEvent(new Event("change"));
        return true;
      }
    }
  }
  for (let i = 0; i < dropdown.options.length; i++) {
    const txt = normalizeProgramName(dropdown.options[i].textContent || "");
    if (txt === target) {
      dropdown.selectedIndex = i;
      dropdown.options[i].selected = true;
      dropdown.dataset.prefilledProgram = dropdown.options[i].textContent || "";
      dropdown.dataset.prefilledProgramId = String(dropdown.options[i].value || "");
      markSelectPrefilled(dropdown);
      dropdown.dispatchEvent(new Event("change"));
      return true;
    }
  }
  // Fallback: fuzzy contains match to tolerate punctuation/spacing variants
  for (let i = 0; i < dropdown.options.length; i++) {
    const txt = normalizeProgramName(dropdown.options[i].textContent || "");
    if (txt && (txt.includes(target) || target.includes(txt))) {
      dropdown.selectedIndex = i;
      dropdown.options[i].selected = true;
      dropdown.dataset.prefilledProgram = dropdown.options[i].textContent || "";
      dropdown.dataset.prefilledProgramId = String(dropdown.options[i].value || "");
      markSelectPrefilled(dropdown);
      dropdown.dispatchEvent(new Event("change"));
      return true;
    }
  }
  const custom = document.createElement("option");
  custom.value = "__selected_program__";
  custom.textContent = programName || `Program ${programId}`;
  // If not found in dropdown, try cache and still attach requirements
  const cached = scholarshipsCache.find((s) => {
    const n = normalizeProgramName(s?.name || "");
    const idMatch = targetId && String(s?.id ?? "").trim() === targetId;
    const nameMatch = n === target || n.includes(target) || target.includes(n);
    return idMatch || nameMatch;
  });
  if (cached) {
    const reqs = normalizeRequirementsValue(cached.requirements);
    custom.dataset.requirements = JSON.stringify(reqs);
  }
  dropdown.appendChild(custom);
  custom.selected = true;
  dropdown.value = custom.value;
  dropdown.dataset.prefilledProgram = custom.textContent || "";
  dropdown.dataset.prefilledProgramId = targetId || "";
  markSelectPrefilled(dropdown);
  dropdown.dispatchEvent(new Event("change"));
  return true;
}

function mergeCampusProgramData(baseData, incomingData) {
  const merged = {};
  const addRow = (campus, department, course) => {
    const c = String(campus || "").trim();
    const d = String(department || "").trim();
    const r = String(course || "").trim();
    if (!c || !d || !r) return;

  Object.entries(baseData || {}).forEach(([campus, departments]) => {
    Object.entries(departments || {}).forEach(([department, courses]) => {
      (courses || []).forEach((course) => addRow(campus, department, course));
    });
  });

  Object.entries(incomingData || {}).forEach(([campus, departments]) => {
    Object.entries(departments || {}).forEach(([department, courses]) => {
      (courses || []).forEach((course) => addRow(campus, department, course));
    });
  });

  return merged;
}

function isDepartmentOnlyToken(courseValue) {
  return String(courseValue || "").trim().toLowerCase() === "__department_only__";
}

async function loadManagedProgramsForApplication() {
  const PROGRAMS_TABLE_CANDIDATES = ["campus_programs", "programs", "courses"];
  const isMissingTableError = (err) => {
    const code = String(err?.code || "").trim().toUpperCase();
    const msg = String(err?.message || "").toLowerCase();
    return (
      code === "42P01" ||
      code === "PGRST205" ||
      msg.includes("could not find the table") ||
      msg.includes("does not exist")
    );
  };

  let programsTable = null;
  for (const candidate of PROGRAMS_TABLE_CANDIDATES) {
    const probe = await supabase.from(candidate).select("*").limit(1);
    if (!probe.error) {
      programsTable = candidate;
      break;
    }
    if (!isMissingTableError(probe.error)) {
      programsTable = candidate;
      break;
    }
  }
  if (!programsTable) {
    showResultMessage("Programs data table is not configured in Supabase yet.", "info");
    return;
  }

  let rows = null;

  try {
    const { data, error } = await supabase
      .from(programsTable)
      .select("*");
    if (error) {
      throw error;
    } else {
      rows = data || [];
    }
  } catch (err) {
    console.warn("Application programs fetch error:", err);
    showResultMessage("Programs data is unavailable right now.", "info");
    return;
  }

  const next = {};
  (rows || []).forEach((row) => {
    const campus = normalizeCampusLabel(row?.campus || "");
    const department = String(row?.department ?? row?.college ?? "").trim();
    const course = String(row?.course_name ?? row?.course ?? row?.name ?? "").trim();
    if (isDepartmentOnlyToken(course)) return;
    if (!campus || !department || !course) return;
    if (!next[campus]) next[campus] = {};
    if (!next[campus][department]) next[campus][department] = [];
    if (!next[campus][department].includes(course)) {
      next[campus][department].push(course);
    }
  });

  if (!Object.keys(next).length) return;
  campusData = mergeCampusProgramData(campusData, next);
}

function setIfPresent(id, value) {
  if (!value && value !== 0) return;
  const el = document.getElementById(id);
  if (el) el.value = value;
}

function selectIfOptionExists(selectEl, value) {
  if (!selectEl || !value) return false;
  const found = Array.from(selectEl.options).some((opt) => opt.value === value);
  if (!found) return false;
  selectEl.value = value;
  markSelectPrefilled(selectEl);
  return true;
}

function normalizeDate(value) {
  if (!value) return "";
  const raw = String(value).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  if (raw.includes("T")) {
    const dateOnly = raw.split("T")[0];
    if (/^\d{4}-\d{2}-\d{2}$/.test(dateOnly)) return dateOnly;
  }
  return "";
}

  setIfPresent("email", prefill.email);

  setIfPresent("birthdate", prefill.birthdate);

    campusSelect.dispatchEvent(new Event("change"));

  if (selectIfOptionExists(departmentSelect, prefill.department)) {
    departmentSelect.dispatchEvent(new Event("change"));

  // 🧩 Parse requirements safely
  function parseRequirements(raw) {
    return normalizeRequirementsValue(raw);
  }

  function inferRequirementsFromOptionText(selectedOption) {
    const selectedLabel = (selectedOption?.textContent || "").trim();
    if (!selectedLabel) return [];

    const selectedNorm = normalizeProgramName(selectedLabel);
    const selectedTokens = new Set(tokenizeProgramName(selectedLabel));
    if (!selectedNorm || !selectedTokens.size) return [];

    let bestReqs = [];
    let bestScore = 0;

    Array.from(dropdown.options || []).forEach((opt) => {
      if (!opt || opt === selectedOption || !opt.value) return;
      const reqs = parseRequirements(opt.dataset.requirements || "[]");
      if (!reqs.length) return;

      const optLabel = (opt.textContent || "").trim();
      const optNorm = normalizeProgramName(optLabel);
      if (!optNorm) return;

      if (optNorm === selectedNorm || optNorm.includes(selectedNorm) || selectedNorm.includes(optNorm)) {
        if (!bestReqs.length) bestReqs = reqs;
        bestScore = 1;
        return;
      }

      const optTokens = tokenizeProgramName(optLabel);
      if (!optTokens.length) return;

      let overlap = 0;
      optTokens.forEach((t) => {
        if (selectedTokens.has(t)) overlap += 1;
      });

      const score = overlap / Math.max(selectedTokens.size, optTokens.length);
      if (score > bestScore) {
        bestScore = score;
        bestReqs = reqs;
      }
    });

    return bestScore >= 0.45 ? bestReqs : [];
  }

  function formatRequirementLabel(key) {
    const cleaned = String(key || "")
      .replace(/^_+/, "")
      .replace(/\.[a-z0-9]+$/i, "")
      .replace(/[_-]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
    return cleaned.toUpperCase();
  }

  function inferRequirementsFromUploadRequirements(value) {
    if (!value) return [];
    let payload = value;
    if (typeof payload === "string") {
      try {
        payload = JSON.parse(payload);
      } catch (_) {
        return [];
      }
    }
    if (!payload || typeof payload !== "object" || Array.isArray(payload)) return [];

    const labels = Object.entries(payload)
      .filter(([, v]) => typeof v === "string" && v.trim().length > 0)
      .map(([k]) => formatRequirementLabel(k))
      .filter(Boolean);

    return Array.from(new Set(labels));
  }

  async function inferRequirementsFromHistory(selectedName) {
    const targetName = (selectedName || "").trim();

        const rowNorm = normalizeProgramName(row?.scholarship_program || "");
        return rowNorm === selectedNorm || rowNorm.includes(selectedNorm) || selectedNorm.includes(rowNorm);
      }) || data[0];

      return inferRequirementsFromUploadRequirements(best?.upload_requirements);
    } catch (_) {
      return [];
    }
  }

  function toRequirementsKey(requirements) {
    const clean = (requirements || [])
      .map((r) => String(r || "").trim())
      .filter(Boolean);
    return JSON.stringify(clean);
  }

  // 🧩 Render requirements in a 3–4 column grid
  function renderRequirementUploads(requirements) {
    const reqKey = toRequirementsKey(requirements);
    if (reqKey === lastRenderedRequirementsKey) return;
    lastRenderedRequirementsKey = reqKey;

    reqUploads.innerHTML = "";
    if (!requirements || !requirements.length) {
      reqContainer.style.display = "block";
      if (reqHint) reqHint.textContent = "No required uploads found for this scholarship.";
      return;
    }

    reqContainer.style.display = "block";
    if (reqHint) reqHint.textContent = "";
    reqUploads.style.display = "grid";
    reqUploads.style.gridTemplateColumns = "repeat(auto-fit, minmax(200px, 1fr))";
    reqUploads.style.gap = "1rem";

    requirements.forEach((req, idx) => {
      const cell = document.createElement("div");

      const label = document.createElement("label");
      label.textContent = req;
      label.className = "req-label";

      const fileLabel = document.createElement("label");
      fileLabel.className = "file";
      fileLabel.setAttribute("for", `req_file_${idx}`);
      fileLabel.innerHTML = `
        <strong id="req_file_label_${idx}">Select file</strong>
        <span class="muted">PDF, JPG or PNG</span>
      `;

      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".pdf,.jpg,.jpeg,.png";
      input.id = `req_file_${idx}`;
      input.name = req.replace(/\s+/g, "_").toLowerCase();
      input.className = "sr-only";
      input.required = true;

      const preview = document.createElement("div");
      preview.className = "preview";
      preview.id = `req_preview_${idx}`;
      preview.innerHTML = `<img alt="${req} preview" />`;

      const img = preview.querySelector("img");
      let objectUrl = null;
      input.addEventListener("change", () => {
        const file = input.files?.[0];
        const textEl = document.getElementById(`req_file_label_${idx}`);
        if (textEl) textEl.textContent = file?.name || "Select file";

        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrl = null;
        }
        if (file && file.type.startsWith("image/")) {
          objectUrl = URL.createObjectURL(file);
          img.src = objectUrl;
          img.alt = `${file.name} preview`;
          preview.classList.add("active");
        } else {
          preview.classList.remove("active");
          img.removeAttribute("src");
        }
      });

      fileLabel.appendChild(input);
      cell.appendChild(label);
      cell.appendChild(fileLabel);
      cell.appendChild(preview);
      reqUploads.appendChild(cell);
    });
  }

  async function resolvePrefilledRequirementsFromSupabase() {
    try {
      if (selectedProgramIdFromUrl) {
        const { data: byId, error: byIdErr } = await supabase
          .from("scholarships")
          .select("*")
          .eq("id", selectedProgramIdFromUrl)
          .maybeSingle();
        if (!byIdErr) {
          const reqs = extractRequirementsFromRow(byId);
          if (reqs.length) return reqs;
        }
      }

      const prefilledName =
        (selectedProgramFromUrl || "").trim() ||
        (selectedScholarshipPayload?.name || "").trim();
      if (!prefilledName) return [];

      const target = normalizeProgramName(prefilledName);
      const { data: allRows, error: allErr } = await supabase
        .from("scholarships")
        .select("*");
      if (allErr || !Array.isArray(allRows) || !allRows.length) return [];

      const exact = allRows.find((row) => normalizeProgramName(row?.name || "") === target);
      if (exact) {
        const reqs = extractRequirementsFromRow(exact);
        if (reqs.length) return reqs;
      }

      const fuzzy = allRows.find((row) => {
        const n = normalizeProgramName(row?.name || "");
        return n && target && (n.includes(target) || target.includes(n));
      });
      if (fuzzy) {
        const reqs = extractRequirementsFromRow(fuzzy);
        if (reqs.length) return reqs;
      }
    } catch (err) {
      console.warn("Prefilled requirement resolution failed:", err);
    }
    return [];
  }

  function resolvePrefilledRequirementsFromCache() {
    const list = Array.isArray(scholarshipsCache) ? scholarshipsCache : [];
    if (!list.length) return [];

    const urlId = String(selectedProgramIdFromUrl || "").trim();
    if (urlId) {
      const byId = list.find((s) => String(s?.id ?? "").trim() === urlId);
      const reqs = extractRequirementsFromRow(byId);
      if (reqs.length) return reqs;

    const wantedName = normalizeProgramName(
      selectedProgramFromUrl || selectedScholarshipPayload?.name || ""

      const byName = list.find((s) => normalizeProgramName(s?.name || "") === wantedName);
      let reqs = extractRequirementsFromRow(byName);
      if (reqs.length) return reqs;

      const fuzzy = list.find((s) => {
        const n = normalizeProgramName(s?.name || "");
        return n && (n.includes(wantedName) || wantedName.includes(n));
      });
      reqs = extractRequirementsFromRow(fuzzy);
      if (reqs.length) return reqs;
    }

    return [];
  }

  async function syncRequirementsForSelection() {
    let selected = dropdown.options[dropdown.selectedIndex] || null;
    let selectedName = (selected?.textContent || "").trim();
    let selectedValue = String(selected?.value || "").trim();

    // If prefilled value is raw text or external script set .value without a valid option,
    // try mapping it to existing options first.
    if (!selected) {
      const raw = String(dropdown.value || "").trim();
      if (raw) {
        applyProgramSelection(raw, "");
        selected = dropdown.options[dropdown.selectedIndex] || null;
        selectedName = (selected?.textContent || raw).trim();
        selectedValue = String(selected?.value || "").trim();
      }
    }
    if (!selected) {
      // Keep empty render behavior, but still allow fallback fetch by raw dropdown value.
      const forced = await fetchRequirementsForSelection({
        value: String(dropdown.value || "").trim(),
        textContent: String(dropdown.value || "").trim()
      });
      renderRequirementUploads(forced);
      return;
    }

    let requirements = parseRequirements(selected.dataset.requirements || "[]");
    if (!requirements.length) {
      const resolvedRow = resolveScholarshipRowFromCurrentState();
      if (resolvedRow) requirements = extractRequirementsFromRow(resolvedRow);
    }
    if (!requirements.length) {
      selectedName = selected.textContent || selectedName;
      selectedValue = selected.value || selectedValue;
      const targetName = normalizeProgramName(selectedName);
      const hit = (scholarshipsCache || []).find((s) => {
        const normalized = normalizeProgramName(s?.name || "");
        const byName = normalized === targetName;
        const byFuzzyName = !!normalized && !!targetName && (normalized.includes(targetName) || targetName.includes(normalized));
        const byId = String(s?.id ?? "") === String(selectedValue);
        return byName || byFuzzyName || byId;
      });
      if (hit) requirements = normalizeRequirementsValue(hit.requirements);

      if (!requirements.length) {
        const best = findBestScholarshipMatch(scholarshipsCache, selectedName, selectedValue);
        if (best) requirements = extractRequirementsFromRow(best);
      }
    }

    if (!requirements.length) {
      requirements = inferRequirementsFromOptionText(selected);
    }

    if (!requirements.length) {
      requirements = await fetchRequirementsForSelection(selected);
    }

    if (!requirements.length) {
      requirements = await inferRequirementsFromHistory(selectedName || selected.textContent || "");
    }

    if (!requirements.length && requirementsFromUrl) {
      requirements = normalizeRequirementsValue(requirementsFromUrl);
    }
    if (!requirements.length && selectedScholarshipPayload) {
      const selectedName = normalizeProgramName(selected.textContent || "");
      const selectedId = String(selected.value || "").trim();
      const payloadName = normalizeProgramName(selectedScholarshipPayload.name || "");
      const payloadId = String(selectedScholarshipPayload.id || "").trim();
      if ((payloadId && selectedId && payloadId === selectedId) || (payloadName && selectedName && (payloadName === selectedName || payloadName.includes(selectedName) || selectedName.includes(payloadName)))) {
        requirements = normalizeRequirementsValue(selectedScholarshipPayload.requirements);
      }
    }
    if (!requirements.length && canonicalPrefilledRequirements.length) {
      requirements = canonicalPrefilledRequirements;
    }

    const hasRenderedInputs = reqUploads.querySelectorAll("input[type=file]").length > 0;
    const selectedText = (selected?.textContent || "").trim().toLowerCase();
    const selectedIsPlaceholder = !selectedValue || selectedText === "select a program";
    if (!requirements.length && hasRenderedInputs && !selectedIsPlaceholder) {
      // Avoid wiping already-rendered requirement uploads due transient lookup misses.
      return;
    }

    renderRequirementUploads(requirements);
  }

  async function renderInitialRequirementsOnce() {
    let requirements = [];

    if (!requirements.length && requirementsFromUrl) {
      requirements = normalizeRequirementsValue(requirementsFromUrl);
    }
    if (!requirements.length && selectedScholarshipPayload?.requirements) {
      requirements = normalizeRequirementsValue(selectedScholarshipPayload.requirements);
    }
    if (!requirements.length) {
      const resolvedRow = resolveScholarshipRowFromCurrentState();
      if (resolvedRow) requirements = extractRequirementsFromRow(resolvedRow);
    }
    if (!requirements.length) {
      const selected = dropdown.options[dropdown.selectedIndex];
      requirements = parseRequirements(selected?.dataset?.requirements || "[]");
    }
    if (!requirements.length) {
      const selected = dropdown.options[dropdown.selectedIndex];
      requirements = await fetchRequirementsForSelection(selected || {
        value: dropdown.value || "",
        textContent: dropdown.value || ""
      });
    }
    if (!requirements.length) {
      const selected = dropdown.options[dropdown.selectedIndex];
      requirements = inferRequirementsFromOptionText(selected);
    }
    if (!requirements.length) {
      const selected = dropdown.options[dropdown.selectedIndex];
      requirements = await inferRequirementsFromHistory(selected?.textContent || dropdown.value || "");
    }
    if (!requirements.length && canonicalPrefilledRequirements.length) {
      requirements = canonicalPrefilledRequirements;
    }

    renderRequirementUploads(requirements);
  }

  // 🧩 When selecting a program, display its requirements
  dropdown.addEventListener("change", async () => {
    const selected = dropdown.options[dropdown.selectedIndex];
    const selectedText = (selected?.textContent || "").trim().toLowerCase();
    const isPlaceholder = !selected || !selected.value || selectedText === "select a program";
    if (isPlaceholder && (selectedProgramFromUrl || selectedProgramIdFromUrl)) {
      applyProgramSelection(selectedProgramFromUrl, selectedProgramIdFromUrl);
      return;
    }
    await syncRequirementsForSelection();
  });

  // Register submit handler early so submission still works
  // even if non-critical initialization below fails.
  if (form && form.dataset.submitBound !== "true") {
    form.dataset.submitBound = "true";
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting…";
      showResultMessage("Submitting application...", "info");

      try {
        if (!supabase) await getSupabaseClient();
        if (!supabase) throw new Error("Supabase client is unavailable.");

        const formData = new FormData(form);
        const { data: { user } } = await supabase.auth.getUser();
        const fallbackUploaderId = (formData.get("email") || "")
          .toString()
          .trim()
          .replace(/[^a-z0-9@._-]/gi, "_");
        const uid = user?.id || `anon_${fallbackUploaderId || Date.now()}`;
        if (!user) {
          showResultMessage("No active session detected in the form frame. Submitting using form details.", "info");
        }

        async function uploadFileAndGetUrl(file, prefix = "other") {
          if (!file) return null;
          const path = `${prefix}/${uid}/${Date.now()}_${file.name}`;
          const { error: upErr } = await supabase.storage
            .from("applicants_iskolar")
            .upload(path, file, { cacheControl: "3600", upsert: false });
          if (upErr) {
            console.error("Upload error", upErr);
            return null;
          }
          const { data } = supabase.storage.from("applicants_iskolar").getPublicUrl(path);
          return data?.publicUrl ?? null;
        }

        const dynamicFiles = {};
        reqUploads.querySelectorAll("input[type=file]").forEach((inp) => {
          dynamicFiles[inp.name] = inp.files?.[0] || null;
        });

        const dynamicUrls = {};
        for (const [k, f] of Object.entries(dynamicFiles)) {
          if (f) dynamicUrls[k] = await uploadFileAndGetUrl(f, "requirements");
        }
        const expectedCount = reqUploads.querySelectorAll("input[type=file]").length;
        if (expectedCount > 0 && Object.keys(dynamicUrls).length < expectedCount) {
          showResultMessage("Please upload all required documents.", "error");
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Application";
          return;
        }

        const programSelect = document.getElementById("scholarshipProgram");
        const selectedProgramName = programSelect.options[programSelect.selectedIndex]?.textContent || null;

        const payload = {
          scholarship_program: selectedProgramName,
          Name: (formData.get("fullName") || "").toString().trim(),
          email: (formData.get("email") || "").toString().trim(),
          contact_number: (formData.get("contactNumber") || "").toString().trim(),
          birthdate: (formData.get("birthdate") || "").toString(),
          address: (formData.get("address") || "").toString().trim(),
          campus: normalizeCampusForStorage((formData.get("campus") || "").toString()),
          department: (formData.get("department") || "").toString(),
          course: (formData.get("course") || "").toString(),
          year_level: (formData.get("yearLevel") || "").toString(),
          mother_name: (formData.get("mothername") || "").toString().trim(),
          mother_number: (formData.get("motherno") || "").toString().trim(),
          father_name: (formData.get("fathername") || "").toString().trim(),
          father_number: (formData.get("fatherno") || "").toString().trim(),
          status: "Pending",
          upload_requirements: JSON.stringify(dynamicUrls),
        };

        const { data: inserted, error } = await supabase
          .from("applicants_iskolar")
          .insert([payload])
          .select("id")
          .maybeSingle();

        if (error || !inserted) {
          console.error("Insert error", error);
          showResultMessage("Failed to submit application: " + (error?.message || "Unknown insert error"), "error");
          showToast("Submission failed. Please try again.");
        } else {
          if (isEmbeddedMode()) {
            showResultMessage("", "success");
          } else {
            showResultMessage(`Application submitted successfully (Ref #${inserted.id}, Campus: ${payload.campus || "N/A"}).`, "success");
            showToast("Application submitted successfully!");
          }
          notifySubmissionSuccessToParent(inserted.id, payload.campus || "");
          form.reset();
          reqUploads.innerHTML = "";
          if (reqHint) reqHint.textContent = "Select a scholarship program to load required uploads.";
          reqContainer.style.display = "block";
        }
      } catch (err) {
        console.error(err);
        showResultMessage("Unexpected error: " + (err?.message || err), "error");
        showToast("Unexpected error: " + (err?.message || err));
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Application";
      }
    });
  }

  await loadScholarshipPrograms();
  await loadManagedProgramsForApplication();
  // Deterministic first pass: resolve row by URL/id/name and render directly.
  if (renderByResolvedScholarshipRow()) {
    // already rendered
  }
  // Render immediately from URL/session payload so prefilled program does not wait for manual selection.
  if (!reqUploads.children.length) renderBootstrapRequirementsIfAny();
  if (!reqUploads.children.length) {
    const cacheReqs = resolvePrefilledRequirementsFromCache();
    if (cacheReqs.length) {
      renderRequirementUploads(cacheReqs);
      if (reqHint) reqHint.textContent = "";
    }
  }
  if (!reqUploads.children.length) {
    const prefilledReqs = await resolvePrefilledRequirementsFromSupabase();
    if (prefilledReqs.length) {
      renderRequirementUploads(prefilledReqs);
      if (reqHint) reqHint.textContent = "";
    }
  }
  if (!reqUploads.children.length && reqHint) {
    reqHint.textContent = "Loading required uploads...";
  }
  if (selectedProgramFromUrl || selectedProgramIdFromUrl) {
    applyProgramSelection(selectedProgramFromUrl, selectedProgramIdFromUrl);
  }
  await renderInitialRequirementsOnce();
  await prefillFromCurrentUser();
  // One more bounded pass after prefill settles.
  setTimeout(() => {
    syncRequirementsForSelection();
  }, 250);
  // Late guard: if a program is selected but no requirements are mounted yet,
  // force another resolution pass after dropdown/data hydration settles.
  setTimeout(() => {
    const selected = dropdown.options[dropdown.selectedIndex];
    const selectedText = (selected?.textContent || "").trim().toLowerCase();
    const hasSelectedProgram = !!selected && !!selected.value && selectedText !== "select a program";
    const hasRequirementInputs = reqUploads.querySelectorAll("input[type=file]").length > 0;
    if (hasSelectedProgram && !hasRequirementInputs) {
      syncRequirementsForSelection();
    }
  }, 1200);
  // Strong guard for preselected-scholarship flow:
  // keep URL/session requirements mounted even if dropdown hydration races.
  setTimeout(() => {
    const hasRequirementInputs = reqUploads.querySelectorAll("input[type=file]").length > 0;
    if (!hasRequirementInputs && canonicalPrefilledRequirements.length) {
      renderRequirementUploads(canonicalPrefilledRequirements);
    }
  }, 1800);

  /**********************
   * Form submission handler is attached above.
   **********************/
});
</script>

    <script src="shared/autocomplete-off.js" defer></script>
</body>
</html>
